<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ PKOIN</title>

  <!-- Официальный SDK Bastyon -->
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

  <script>
    (function() {
      // Резервная отправка сигналов listening, пока загружается SDK
      function pingParent() {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'pocketnet_pong', status: 'listening' }, '*');
          window.parent.postMessage({ action: 'listening' }, '*');
        }
      }
      pingParent();
      var pinger = setInterval(pingParent, 100);

      document.addEventListener('DOMContentLoaded', async function() {
        clearInterval(pinger);
        try {
          if (window.BastyonSdk) {
            const sdk = new window.BastyonSdk();
            await sdk.init();
            window.sdk = sdk;
            
            // Сообщаем оболочке Bastyon, что dApp слушает и готово
            sdk.emit('loaded');
          }
        } catch (e) {
          console.error('Ошибка инициализации SDK:', e);
        }
      });
    })();
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
