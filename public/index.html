<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ PKOIN</title>

  <!-- Официальный скрипт SDK Bastyon из документации -->
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      try {
        if (window.BastyonSdk) {
          const sdk = new window.BastyonSdk();
          await sdk.init();
          window.sdk = sdk; // Сохраняем в глобальный доступ
          
          // Сообщаем платформе, что приложение полностью загружено
          sdk.emit('loaded');
          console.log('Bastyon SDK инициализирован успешно');
        }
      } catch (e) {
        console.error('Ошибка инициализации Bastyon SDK:', e);
      }
    });
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
