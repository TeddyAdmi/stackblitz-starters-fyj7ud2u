<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>КНБ PKOIN</title>
  <script>
    (function() {
      function sendReady() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'pocketnet_pong', status: 'listening' }, '*');
            window.parent.postMessage({ type: 'app_ready', status: 'ready' }, '*');
            window.parent.postMessage({ action: 'listening' }, '*');
          }
        } catch(e) {}
      }
      sendReady();
      window.addEventListener('message', sendReady);
      var interval = setInterval(sendReady, 50);
      setTimeout(function() { clearInterval(interval); }, 3000);
    })();
  </script>
</head>
<body style="background:#0f172a; color:#fff; font-family:sans-serif; text-align:center; padding-top:50px;">
  <h1>КНБ PKOIN dApp</h1>
  <p>Приложение успешно загружено в Bastyon</p>
</body>
</html>
