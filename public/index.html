<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ PKOIN</title>
  <script>
    (function() {
      function handshake() {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'pocketnet_pong', status: 'listening' }, '*');
          window.parent.postMessage({ type: 'app_ready', status: 'ready' }, '*');
          window.parent.postMessage({ action: 'listening' }, '*');
          window.parent.postMessage({ status: 'ready' }, '*');
        }
      }
      handshake();
      window.addEventListener('message', handshake);
      setInterval(handshake, 300);
    })();
  </script>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>КНБ PKOIN dApp</h2>
    <p>Приложение успешно запущено в Bastyon!</p>
  </div>
</body>
</html>
