<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Simple App</title>
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #222; color: #fff; }
  </style>
</head>
<body>
  <h1>🚀 Тестовое приложение работает!</h1>
  <p id="status">Загрузка SDK...</p>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const sdk = new window.BastyonSdk();
        await sdk.init();
        sdk.emit('loaded'); // Обязательный сигнал Bastyon
        document.getElementById('status').innerText = 'Приложение подключено!';
      } catch (e) {
        document.getElementById('status').innerText = 'Ошибка инициализации';
      }
    });
  </script>
</body>
</html>
