<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ PKOIN</title>

  <script>
    // Блокируем падение FocusListener в Bastyon
    window.focus();
    window.addEventListener('blur', function() { window.focus(); });

    (function() {
      function sendPong() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'pocketnet_pong', status: 'listening' }, '*');
            window.parent.postMessage({ type: 'app_ready', status: 'ready' }, '*');
            window.parent.postMessage({ action: 'listening' }, '*');
            window.parent.postMessage({ status: 'ready' }, '*');
          }
        } catch(e) {}
      }

      sendPong();
      window.addEventListener('message', sendPong);
      setInterval(sendPong, 100);
    })();
  </script>

  <style>
    body {
      background: #0f172a;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
    }
    button {
      background: #f59e0b;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>КНБ PKOIN dApp</h2>
    <p>Успешно подключено к Bastyon!</p>
    <button onclick="alert('Кошелек работает!')">Подключить кошелек</button>
  </div>

</body>
</html>
