<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ PKOIN</title>

  <script>
    // Постоянный пульс (Heartbeat) для предотвращения скрытия кнопки по таймауту
    (function() {
      function sendHandshake() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'pocketnet_pong', status: 'listening' }, '*');
            window.parent.postMessage({ type: 'app_ready', status: 'ready' }, '*');
            window.parent.postMessage({ action: 'listening' }, '*');
            window.parent.postMessage({ status: 'ready' }, '*');
          }
        } catch(e) {}
      }

      // 1. Немедленный вызов
      sendHandshake();

      // 2. Отклик на любые входящие сигналы
      window.addEventListener('message', function(event) {
        sendHandshake();
      });

      // 3. Отправка каждые 500мс для удерживания фокуса и интерфейса
      setInterval(sendHandshake, 500);
    })();
  </script>

  <style>
    body {
      margin: 0;
      background-color: #0f172a;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
    button {
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>КНБ PKOIN dApp</h2>
    <p>Соединение с Bastyon удерживается!</p>
    <button onclick="alert('Работает!')">Проверить</button>
  </div>

</body>
</html>
