<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ PKOIN</title>

  <script>
    // Принудительно откликаемся на рукопожатие Bastyon
    (function() {
      function sendPong() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'pocketnet_pong', status: 'listening' }, '*');
            window.parent.postMessage({ type: 'app_ready', status: 'ready' }, '*');
            window.parent.postMessage({ action: 'listening' }, '*');
            window.parent.postMessage({ status: 'ready' }, '*');
          }
        } catch(e) {}
      }

      // Отправляем ответ моментально и слушаем входящие сообщения
      sendPong();
      window.addEventListener('message', sendPong);
      
      // Непрерывный отклик для FocusListener
      setInterval(sendPong, 100);
    })();
  </script>

  <style>
    body {
      margin: 0;
      background-color: #0f172a;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>КНБ PKOIN</h2>
    <p>Приложение успешно запущено!</p>
  </div>

</body>
</html>
