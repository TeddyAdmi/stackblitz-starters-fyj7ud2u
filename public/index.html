<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ PKOIN</title>

  <script>
    // 1. Предотвращаем сбой FocusListener в Bastyon
    try {
      window.focus();
      window.addEventListener('blur', function() { window.focus(); });
    } catch(e) {}

    // 2. Гарантированный постоянный отклик для Bastyon
    (function() {
      function sendPong() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'pocketnet_pong', status: 'listening' }, '*');
            window.parent.postMessage({ type: 'app_ready', status: 'ready' }, '*');
            window.parent.postMessage({ action: 'listening' }, '*');
            window.parent.postMessage({ status: 'ready' }, '*');
          }
        } catch(e) {}
      }

      sendPong();
      window.addEventListener('message', sendPong);
      setInterval(sendPong, 200);
    })();
  </script>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
    button {
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>КНБ PKOIN dApp</h2>
    <p>Приложение загружено успешно!</p>
    <button onclick="alert('Кошелек подключен!')">Проверить</button>
  </div>

</body>
</html>
