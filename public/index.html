<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dApp</title>

  <!-- Подключение официальной библиотеки Bastyon SDK -->
  <script src="https://bastyon.com/js/vendor/pocketnet/sdk.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Инициализация SDK Bastyon
      if (window.PocketnetApp) {
        window.sdk = new PocketnetApp();
        
        // Обязательная регистрация слушателей и отправка состояния готовности
        window.sdk.init().then(function() {
          console.log('Bastyon SDK успешно инициализирован');
          
          // Сообщаем оболочке Bastyon, что dApp готово к работе и отображению
          window.sdk.emit('ready', true);
        }).catch(function(err) {
          console.error('Ошибка инициализации SDK:', err);
        });
      } else {
        // Резервное рукопожатие через postMessage на случай задержки загрузки SDK
        var sendInit = function() {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'app_ready', status: true }, '*');
            window.parent.postMessage({ action: 'ready' }, '*');
          }
        };
        sendInit();
        setInterval(sendInit, 200);
      }
    });
  </script>
</head>
<body>
  <div id="root">
    <h1>Приложение загружено в Bastyon!</h1>
  </div>
</body>
</html>
