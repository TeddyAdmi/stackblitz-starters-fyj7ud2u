<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ PKOIN</title>
  
  <!-- Подключение SDK по документации -->
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>

  <script>
    let sdk = null;

    async function initializeApp() {
      try {
        // Инициализация SDK согласно документации
        sdk = new window.BastyonSdk();
        await sdk.init();
        
        // Сигнал платформе Bastyon о завершении загрузки
        sdk.emit('loaded');
        console.log('Bastyon SDK успешно инициализирован');

        // Проверка наличия прав
        const hasMessaging = await sdk.permissions.check({ permission: 'messaging' });
        if (!hasMessaging) {
          await sdk.permissions.request(['messaging']);
        }

      } catch (error) {
        console.error('Ошибка инициализации Bastyon SDK:', error);
      }
    }

    // Вызов уведомления через Bastyon SDK по клику пользователя
    async function showAlert(text) {
      if (!sdk) return;
      try {
        await sdk.helpers.alert(text);
      } catch (err) {
        console.error('Ошибка при вызове sdk.helpers.alert:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', initializeApp);
  </script>
</head>
<body>
  <button onclick="showAlert('Привет из dApp!')">Показать уведомление</button>
</body>
</html>
